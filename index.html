
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>MY BODY 2.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0c1424;color:#f2f6ff;font:15px -apple-system,sans-serif;padding:18px 15px 95px}
h1{font-size:30px;margin:8px 0}
h2{font-size:20px}
small,.muted{color:#a9b9d1}
.card{background:#1a2940;border:1px solid #344561;border-radius:16px;padding:16px;margin:13px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .card{margin:0}
.big{font-size:30px;font-weight:bold}
button{border:0;border-radius:10px;padding:12px;background:#8aafff;color:#101827;font-weight:bold}
.wide{width:100%;margin-top:10px}
input,textarea,select{background:#101b30;color:white;border:1px solid #4c6081;border-radius:10px;padding:12px;width:100%;font-size:16px;margin:6px 0}
input[type=checkbox]{width:22px;height:22px;margin:0}
.check{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #344561}
.page{display:none}
.page.on{display:block}
nav{position:fixed;bottom:0;left:0;right:0;background:#17253c;display:flex;justify-content:space-around;padding:12px 2px 24px}
nav button{background:transparent;color:#b9c9df;font-size:12px;padding:9px}
nav button.on{background:#385680;color:white}
.bar{background:#36445d;height:10px;border-radius:8px;overflow:hidden}
#fill{height:100%;background:#8aafff;width:0}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{background:#2b3d56;text-align:center;padding:10px 0;border-radius:8px;font-size:12px}
.done{background:#32785c}
.graph{height:130px;display:flex;align-items:end;gap:6px}
.graph div{flex:1;background:#8aafff;border-radius:5px 5px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item{padding:10px 0;border-bottom:1px solid #344561}
</style>
</head>
<body>
<small>PERSONAL TRAINING TRACKER</small>
<h1>MY BODY 2.0</h1>
<small id="today"></small>

<section class="page on" id="home">
<h2>今日のトレーニング</h2>
<div class="card">
<small id="type"></small>
<h2 id="title"></h2>
<p id="description" class="muted"></p>
<p id="progress"></p>
<div class="bar"><div id="fill"></div></div>
<button class="wide" onclick="tab('train')">トレーニングを始める</button>
</div>
<div class="grid">
<div class="card">今週の運動日数<div class="big" id="weekly">0</div></div>
<div class="card">今月の運動日数<div class="big" id="monthly">0</div></div>
</div>
<div class="card">
<b>目標</b>
<p>腹筋が見える引き締まった体を目指す。</p>
<small>器具なし・室内トレーニング。食事制限なし。毎日運動または回復を行う。</small>
</div>
</section>

<section class="page" id="train">
<h2>今日のメニュー</h2>
<div class="card" id="exercises"></div>
<div class="card">
<b>トレーニングメモ</b>
<textarea id="memo" placeholder="回数・セット数・体調など"></textarea>
<select id="effort">
<option value="">きつさを選択</option>
<option>楽</option>
<option>普通</option>
<option>きつい</option>
</select>
<button class="wide" onclick="complete()">今日の活動を記録</button>
<p id="message"></p>
</div>
</section>

<section class="page" id="records">
<h2>成長記録</h2>
<div class="card">
<b>今月のカレンダー</b>
<div class="calendar" id="calendar"></div>
<p><small>緑色＝運動・回復を記録した日</small></p>
</div>
<div class="card">
<b>直近7日間の達成項目数</b>
<div class="graph" id="graph"></div>
</div>
<div class="card">
<b>活動履歴</b>
<div id="history"></div>
</div>
<div class="card">
<b>バックアップ</b>
<button class="wide" onclick="backup()">記録をコピー</button>
<textarea id="backupdata" placeholder="復元データを貼り付け"></textarea>
<button class="wide" onclick="restore()">記録を復元</button>
</div>
</section>

<section class="page" id="ai">
<h2>チャッピーに相談</h2>
<div class="card">
<p>今までの前提と最近の筋トレ記録をまとめて、ChatGPTで相談できるよ。</p>
<textarea id="question" placeholder="例：今日のトレーニングを改善して"></textarea>
<button class="wide" onclick="makePrompt()">相談文を作成・コピー</button>
<textarea id="prepared" rows="7" placeholder="相談文が表示されます"></textarea>
<button class="wide" onclick="window.open('https://chatgpt.com/','_blank')">ChatGPTを開く</button>
<p><small>ChatGPTで「筋肉」プロジェクトのこの会話を選び、文章を貼り付けてね。</small></p>
</div>
</section>

<nav>
<button class="on" onclick="tab('home')">ホーム</button>
<button onclick="tab('train')">筋トレ</button>
<button onclick="tab('records')">記録</button>
<button onclick="tab('ai')">AI相談</button>
</nav>

<script>
const KEY="mybody_training_v2";
const $=id=>document.getElementById(id);
const date=(d=new Date())=>
 d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=date();

const plans=[
{title:"上半身＋体幹",type:"筋トレ",items:["腕立て伏せ 8〜12回×3セット","膝つき腕立て 10回×2セット","プランク 30秒×3セット","デッドバグ 左右10回×2セット"]},
{title:"下半身＋体幹",type:"筋トレ",items:["スクワット 15回×3セット","リバースランジ 左右10回×2セット","ヒップリフト 15回×3セット","サイドプランク 左右20秒×2セット"]},
{title:"軽い運動・回復",type:"回復日",items:["室内足踏み 10分","ストレッチ 5分","姿勢チェック"]},
{title:"全身トレーニング",type:"筋トレ",items:["スクワット 15回×3セット","腕立て伏せ 10回×3セット","バードドッグ 左右10回×2セット","クランチ 15回×2セット"]},
{title:"軽い体幹・ストレッチ",type:"軽めの日",items:["デッドバグ 左右8回×2セット","バードドッグ 左右8回×2セット","ストレッチ 5分"]},
{title:"全身トレーニング",type:"筋トレ",items:["ランジ 左右10回×2セット","腕立て伏せ 8回×3セット","ヒップリフト 15回×2セット","プランク 30秒×2セット"]},
{title:"休息・リカバリー",type:"休息日",items:["疲労・痛みのチェック","軽いストレッチ（任意）"]}
];
const plan=plans[(new Date().getDay()+6)%7];

let data;
try{
 data=JSON.parse(localStorage.getItem(KEY))||{days:{}};
 if(!data.days||typeof data.days!=="object")data={days:{}};
}catch(e){data={days:{}}}

function entry(){
 if(!data.days[today])data.days[today]={checked:{},memo:"",effort:"",finished:false};
 return data.days[today];
}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function tab(id){
 document.querySelectorAll(".page").forEach(x=>x.classList.toggle("on",x.id===id));
 const ids=["home","train","records","ai"];
 document.querySelectorAll("nav button").forEach((b,i)=>b.classList.toggle("on",ids[i]===id));
 window.scrollTo(0,0);
}
function toggle(i,value){
 entry().checked[i]=value;
 save();
}
function complete(){
 const e=entry();
 e.memo=$("memo").value;
 e.effort=$("effort").value;
 e.finished=true;
 save();
 $("message").textContent="今日の記録を保存したよ！";
}
function render(){
 const e=entry();
 $("today").textContent=new Date().toLocaleDateString("ja-JP",{dateStyle:"full"});
 $("title").textContent=plan.title;
 $("type").textContent=plan.type;
 $("description").textContent=plan.type==="休息日"?"しっかり休んで筋肉を回復させよう。":"無理せずフォームを優先しよう。";
 const count=plan.items.filter((_,i)=>e.checked[i]).length;
 $("progress").textContent=count+" / "+plan.items.length+" 項目";
 $("fill").style.width=(count/plan.items.length*100)+"%";
 $("exercises").replaceChildren();
 plan.items.forEach((name,i)=>{
  const label=document.createElement("label");
  label.className="check";
  const box=document.createElement("input");
  box.type="checkbox";
  box.checked=!!e.checked[i];
  box.onchange=()=>toggle(i,box.checked);
  label.append(box,document.createTextNode(name));
  $("exercises").append(label);
 });
 $("memo").value=e.memo||"";
 $("effort").value=e.effort||"";
 const finished=Object.keys(data.days).filter(d=>data.days[d].finished);
 $("monthly").textContent=finished.filter(d=>d.slice(0,7)===today.slice(0,7)).length;
 const now=new Date();
 const monday=new Date(now.getFullYear(),now.getMonth(),now.getDate()-(now.getDay()+6)%7);
 $("weekly").textContent=finished.filter(d=>d>=date(monday)&&d<=today).length;

 const first=new Date(now.getFullYear(),now.getMonth(),1);
 const days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
 $("calendar").replaceChildren();
 ["月","火","水","木","金","土","日"].forEach(s=>{
  const el=document.createElement("div");el.className="day";el.textContent=s;$("calendar").append(el);
 });
 for(let i=0;i<(first.getDay()+6)%7;i++)$("calendar").append(document.createElement("div"));
 for(let i=1;i<=days;i++){
  const d=date(new Date(now.getFullYear(),now.getMonth(),i));
  const el=document.createElement("div");
  el.className="day"+(data.days[d]?.finished?" done":"");
  el.textContent=i;
  $("calendar").append(el);
 }
 $("graph").replaceChildren();
 for(let i=6;i>=0;i--){
  const d=new Date();d.setDate(d.getDate()-i);
  const v=Object.values(data.days[date(d)]?.checked||{}).filter(Boolean).length;
  const bar=document.createElement("div");
  bar.style.height=Math.max(2,v*20)+"%";
  bar.title=date(d)+"："+v+"項目";
  $("graph").append(bar);
 }
 $("history").replaceChildren();
 finished.sort().reverse().slice(0,20).forEach(d=>{
  const row=document.createElement("div");
  row.className="item";
  row.textContent=d+"：活動完了";
  $("history").append(row);
 });
}
function backup(){
 const text=JSON.stringify(data);
 $("backupdata").value=text;
 navigator.clipboard?.writeText(text).then(()=>alert("コピーしたよ")).catch(()=>alert("欄の文章を長押ししてコピーしてね"));
}
function restore(){
 try{
  const d=JSON.parse($("backupdata").value);
  if(!d.days||typeof d.days!=="object")throw Error();
  if(!confirm("現在の記録を上書きする？"))return;
  data=d;save();alert("復元したよ");
 }catch(e){alert("データを確認してね")}
}
function makePrompt(){
 const recent=Object.keys(data.days).sort().reverse().slice(0,14).map(d=>{
  const e=data.days[d];
  return d+"："+(e.finished?"完了":"未完了")+"、達成"+Object.values(e.checked||{}).filter(Boolean).length+"項目、きつさ："+(e.effort||"未記録")+"、メモ："+(e.memo||"なし");
 }).join("\n");
 const q=$("question").value.trim()||"今の筋トレメニューを改善して";
 const text=`筋肉プロジェクトの相談です。
【基本情報】
21歳男性、身長169cm、以前の体重68kg。
目標：腹筋が見える引き締まった体。
食事制限・カロリー管理はしない。
自宅室内、器具なし。
毎日何かしら活動するが、回復日も取り入れる。
【今日のメニュー】
${plan.title}
${plan.items.join("、")}
【最近の記録】
${recent||"まだ記録なし"}
【相談内容】
${q}
記録を踏まえて、現実的なアドバイスをお願いします。`;
 $("prepared").value=text;
 navigator.clipboard?.writeText(text).then(()=>alert("コピーしたよ。この会話に貼り付けてね")).catch(()=>alert("文章を長押ししてコピーしてね"));
}
render();
</script>
</body>
</html>
